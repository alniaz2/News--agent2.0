
name: News Trend Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  find-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find trending topics
        run: python trend_hunter.py

      - name: Research news reports
        run: python news_researcher.py

      - name: Rank trending stories
        run: python trend_scorer.py

      - name: Save news research results
        uses: actions/upload-artifact@v4
        with:
          name: ranked-news-results
          path: |
            trends.json
            research.json
            ranked_news.json
          if-no-files-found: error
          retention-days: 7
